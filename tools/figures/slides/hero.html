<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StreetNet</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
  .slide.bleed { background: #0d1117; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(13, 17, 23, 0.94) 0%, rgba(13, 17, 23, 0.86) 30%, rgba(13, 17, 23, 0.45) 52%,
                rgba(13, 17, 23, 0) 72%);
  }
  .shade-b { position: absolute; inset: auto 0 0 0; height: 120px;
             background: linear-gradient(0deg, rgba(13, 17, 23, 0.55), rgba(13, 17, 23, 0)); }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column;
          justify-content: center; gap: 20px; }
  .name { font-size: 76px; font-weight: 640; letter-spacing: -0.035em; line-height: 1; color: #f0f6fc; }
  .lede { font-size: 23px; line-height: 1.42; color: #c9d1d9; letter-spacing: -0.006em; max-width: 470px; }
  .foot { position: absolute; left: 64px; bottom: 26px; font-size: 13.5px; color: rgba(240, 246, 252, 0.66); }
</style>
</head>
<body data-size="1200x500" data-format="jpg" data-quality="88">
<div class="slide bleed">
  <img class="photo" src="../../../docs/assets/img/hero.jpg" alt="">
  <div class="shade"></div>
  <div class="shade-b"></div>
  <div class="text">
    <p class="name">StreetNet</p>
    <p class="lede">An automated, ready-to-deploy asset management system that maps street assets from street-level panoramas.</p>
  </div>
  <p class="foot">Detections in one panorama in Harlem, coloured by class group. Imagery © Google.</p>
</div>
</body>
</html>
