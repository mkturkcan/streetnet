[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streetnet"
version = "0.2.0"
description = "Open-vocabulary street asset inventories from street-level panoramas: concept segmentation, single-view localization, and cross-panorama fusion."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mehmet Kerem Turkcan" }]
keywords = ["street assets", "asset inventory", "street view", "SAM 3.1", "MoGe-3", "SigLIP 2", "mapping", "geospatial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyproj>=3.6",
]

[project.optional-dependencies]
detect = [
    "torch>=2.5",
    "transformers>=4.49",
    "huggingface_hub>=0.34",
    "pillow>=10",
    "pycocotools>=2.0.7",
    "opencv-python>=4.9",                # also a dependency of MoGe
    "setuptools<82",                     # SAM 3 imports pkg_resources, removed in setuptools 82
    "sam3 @ git+https://github.com/facebookresearch/sam3@96914d2425f90a64f45ca977c2b5165418099543",
    "moge @ git+https://github.com/microsoft/MoGe@74fbce054ebed49800de42d0ad0e83495065719a",
]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
streetnet = "streetnet.cli:main"

[project.urls]
Repository = "https://github.com/mkturkcan/streetnet"
"Asset map" = "https://huggingface.co/datasets/mehmetkeremturkcan/streetnet-nyc"

[tool.setuptools.packages.find]
include = ["streetnet*"]

[tool.setuptools.package-data]
streetnet = ["configs/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "B023", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
